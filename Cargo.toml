[package]
name = "tortor"
version = "1.8.0"
edition = "2021"
authors = ["Vitaly Golik <GLK Dev>"]
description = "High-performance BitTorrent client with dynamic SIMD dispatch and zero-copy I/O"
repository = "https://github.com/GLK-Dev/tortor"
license = "MIT OR Apache-2.0"
keywords = ["bittorrent", "p2p", "simd", "io_uring", "networking"]
categories = ["network-programming", "command-line-utilities"]

[features]
default = ["gui"]
gui = [
    "dep:hey-core",
    "dep:hey-draw",
    "dep:hey-layout",
    "dep:hey-style",
    "dep:hey-text",
    "dep:hey-widgets",
    "dep:hey-i18n",
    "dep:hey-shell",
]

[dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"


async-trait = "0.1.80"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bencode = "0.2"
serde_bytes = "0.11"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.30", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2.4"
hey-core = { path = "../Hey/crates/hey-core", optional = true }
hey-draw = { path = "../Hey/crates/hey-draw", optional = true }
hey-layout = { path = "../Hey/crates/hey-layout", optional = true }
hey-style = { path = "../Hey/crates/hey-style", optional = true }
hey-text = { path = "../Hey/crates/hey-text", optional = true }
hey-widgets = { path = "../Hey/crates/hey-widgets", optional = true }
hey-i18n = { path = "../Hey/crates/hey-i18n", optional = true }
hey-shell = { path = "../Hey/crates/hey-shell", optional = true }
dirs = "6"
igd-next = { version = "0.17", features = ["aio_tokio"] }
socket2 = { version = "0.6", features = ["all"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"



[dev-dependencies]
criterion = "0.5"

# [[bench]]
# name = "hash_bench"
# harness = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1





[build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.4.0"

