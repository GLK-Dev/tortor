name: CI

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Lint, test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build release GUI
        run: cargo build --release

      - name: Package macOS TorTor.app
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/macos/build_app.sh
          ./packaging/macos/build_app.sh target/release/tortor dist
          ditto -c -k --sequesterRsrc --keepParent dist/TorTor.app dist/tortor-macos-arm64.zip

      - name: Package Linux GUI archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/tortor-linux
          cp target/release/tortor dist/tortor-linux/
          cp packaging/linux/tortor.desktop packaging/linux/install.sh Images/tortor_icon.png README.md LICENSE dist/tortor-linux/
          chmod +x dist/tortor-linux/tortor dist/tortor-linux/install.sh
          tar -C dist -czf dist/tortor-linux-x86_64.tar.gz tortor-linux

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tortor-${{ matrix.os }}
          path: |
            target/release/tortor.exe
            dist/tortor-linux-x86_64.tar.gz
            dist/tortor-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

  headless:
    name: Build without the GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo build --release --no-default-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}